name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly: slow statistical tests
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.21"

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -m "not slow" --cov --cov-report=term-missing:skip-covered
      - name: Coverage of fieldtrial.stats (at least 98%)
        run: uv run coverage report --include="*/fieldtrial/stats/*" --fail-under=98

  slow:
    name: Slow statistical tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Slow tests
        run: uv run pytest -m slow
