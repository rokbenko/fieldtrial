name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra docs
      - name: Build (strict)
        run: uv run mkdocs build --strict
