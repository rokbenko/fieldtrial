<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false, "selfRequestsOnly": true, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx-2.0.11.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-headers="{{ htmx_headers }}">
  <header class="top">
    <a class="brand" href="/">fieldtrial</a>
    {% block nav %}{% endblock %}
    {% if lan %}<span class="badge" title="Served on the local network with an access token">LAN</span>{% endif %}
  </header>
  <div id="flash" role="alert" aria-live="assertive"></div>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
