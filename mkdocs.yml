site_name: fieldtrial
site_description: Find out whether your robot policy actually got better.
site_author: Rok Benko
repo_url: https://github.com/rokbenko/fieldtrial
repo_name: rokbenko/fieldtrial
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Rok Benko. Apache-2.0.

theme:
  name: material
  font: false  # system fonts: no requests to third-party font servers
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

# The kickoff plan is published but kept out of the navigation.
not_in_nav: |
  /PLAN.md

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Using fieldtrial:
      - Running a study: studies.md
      - Operator console: console.md
      - Analysis and reports: analysis.md
      - Command line: cli.md
      - REST API and client: api.md
  - Guides:
      - How many rollouts do I need?: guides/how-many-rollouts.md
      - Comparing two checkpoints: guides/comparing-checkpoints.md
      - Checkpoint ladders: guides/checkpoint-ladders.md
      - Serving-config sweeps: guides/serving-sweeps.md
      - Real blinding with runners: guides/runners.md
      - Evaluation camera and rig checks: guides/capture.md
      - Using fieldtrial with LeRobot: guides/lerobot.md
      - Using fieldtrial with openpi: guides/openpi.md
      - Custom runtimes via REST: guides/custom-runtimes.md
      - Testing the console on a phone: guides/console-checklist.md
  - Statistics:
      - Overview: stats/index.md
      - One arm: stats/intervals.md
      - Two independent arms: stats/two-arms.md
      - Paired designs: stats/paired.md
      - Multiplicity: stats/multiplicity.md
      - Progress stages: stats/stages.md
      - Time to success: stats/timing.md
      - Stratified (CMH): stats/stratified.md
      - Drift checks: stats/drift.md
      - Checkpoint ladders: stats/ladders.md
      - Crossover rounds: stats/crossover.md
      - Group-sequential stopping: stats/sequential.md
      - Anytime-valid comparisons: stats/anytime.md
      - Best-arm selection: stats/selection.md
      - "STEP: an evaluation": stats/step-evaluation.md
      - Planning: stats/planning.md
      - Bayesian summaries: stats/bayes.md
  - Reference:
      - Python API: reference/api.md
  - Roadmap: ROADMAP.md
